name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to release; must exactly match msa.app.version
        required: true
        type: string
      build_ios_archive:
        description: Build and export a signed iOS archive using repository secrets
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Offline release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6842eb843b7258993656f41f9c358f5c5331fbe7 # v4
      - uses: actions/setup-python@efa8de904209196588db1453bdb44079b3c393d7 # v5
        with:
          python-version: '3.12'
      - name: Verify pushed tag and project version
        if: github.event_name == 'push'
        run: python scripts/verify_release_tag.py "${GITHUB_REF_NAME}"
      - name: Verify manually requested version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python scripts/verify_release_tag.py "v${RELEASE_VERSION}"
      - name: Verify structure, secrets and generated assets
        run: |
          python scripts/verify_project.py
          python scripts/verify_generated_assets.py
          python scripts/verify_ui.py

  android-signed:
    needs: preflight
    name: Signed Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6842eb843b7258993656f41f9c358f5c5331fbe7 # v4
      - uses: actions/setup-java@0969d5d4288c995edd83fa23bc91e83a2c03ba22 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@efa8de904209196588db1453bdb44079b3c393d7 # v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@2b23091730423deba6728fa9a964726ea09e2cd9 # v3
      - uses: gradle/actions/setup-gradle@864def28bf3f78138bbe1c563d360930ae4bb909 # v6
      - run: chmod +x gradlew
      - name: Validate Android signing secrets and restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MSA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MSA_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MSA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MSA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"], "msa-release.jks").write_bytes(
              base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True)
          )
          PY
          chmod 600 "$RUNNER_TEMP/msa-release.jks"
      - name: Test, lint and build signed APK/AAB
        env:
          MSA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/msa-release.jks
          MSA_ANDROID_STORE_PASSWORD: ${{ secrets.MSA_ANDROID_STORE_PASSWORD }}
          MSA_ANDROID_KEY_ALIAS: ${{ secrets.MSA_ANDROID_KEY_ALIAS }}
          MSA_ANDROID_KEY_PASSWORD: ${{ secrets.MSA_ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :composeApp:verifyBuildIdentity
          :composeApp:jvmTest
          :composeApp:lintRelease
          :composeApp:assembleRelease
          :composeApp:bundleRelease
          --no-daemon
          --stacktrace
      - name: Verify signatures
        run: |
          APK="$(find composeApp/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          AAB="$(find composeApp/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          test -n "$APK" && test -n "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -strict -certs "$AAB"
      - name: Create dependency and checksum reports
        run: |
          ./gradlew :composeApp:dependencies --no-daemon > dependency-report.txt
          python scripts/hash_artifacts.py \
            composeApp/build/outputs/apk/release \
            composeApp/build/outputs/bundle/release \
            --output android-release-checksums.sha256
      - name: Remove temporary Android signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/msa-release.jks"
      - uses: actions/upload-artifact@2a0ecf19e8d0087dd2e5d1785dcf764811e79fae # v4
        with:
          name: android-signed-release
          path: |
            composeApp/build/outputs/apk/release/*.apk
            composeApp/build/outputs/bundle/release/*.aab
            android-release-checksums.sha256
            dependency-report.txt
            composeApp/build/reports/lint-results-release.html
            composeApp/build/reports/tests/**
          if-no-files-found: error

  desktop:
    needs: preflight
    name: Desktop release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@6842eb843b7258993656f41f9c358f5c5331fbe7 # v4
      - uses: actions/setup-java@0969d5d4288c995edd83fa23bc91e83a2c03ba22 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@efa8de904209196588db1453bdb44079b3c393d7 # v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@864def28bf3f78138bbe1c563d360930ae4bb909 # v6
      - if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Test and build current OS package
        shell: bash
        run: >-
          ./gradlew
          :composeApp:verifyBuildIdentity
          :composeApp:jvmTest
          :composeApp:packageReleaseDistributionForCurrentOS
          --no-daemon
          --stacktrace
      - name: Create checksums
        run: >-
          python scripts/hash_artifacts.py
          composeApp/build/compose/binaries
          --suffix .deb
          --suffix .msi
          --suffix .dmg
          --output desktop-release-checksums.sha256
      - uses: actions/upload-artifact@2a0ecf19e8d0087dd2e5d1785dcf764811e79fae # v4
        with:
          name: desktop-release-${{ runner.os }}
          path: |
            composeApp/build/compose/binaries/**/*.deb
            composeApp/build/compose/binaries/**/*.msi
            composeApp/build/compose/binaries/**/*.dmg
            desktop-release-checksums.sha256
          if-no-files-found: error

  web:
    needs: preflight
    name: Web release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@6842eb843b7258993656f41f9c358f5c5331fbe7 # v4
      - uses: actions/setup-java@0969d5d4288c995edd83fa23bc91e83a2c03ba22 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@efa8de904209196588db1453bdb44079b3c393d7 # v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@864def28bf3f78138bbe1c563d360930ae4bb909 # v6
      - run: chmod +x gradlew
      - name: Test and build JS/Wasm distributions
        run: >-
          ./gradlew
          :composeApp:verifyBuildIdentity
          :composeApp:jsBrowserTest
          :composeApp:wasmJsBrowserTest
          :composeApp:jsBrowserDistribution
          :composeApp:wasmJsBrowserDistribution
          --no-daemon
          --stacktrace
      - name: Create checksums
        run: >-
          python scripts/hash_artifacts.py
          composeApp/build/dist/js/productionExecutable
          composeApp/build/dist/wasmJs/productionExecutable
          --output web-release-checksums.sha256
      - uses: actions/upload-artifact@2a0ecf19e8d0087dd2e5d1785dcf764811e79fae # v4
        with:
          name: web-release
          path: |
            composeApp/build/dist/js/productionExecutable/**
            composeApp/build/dist/wasmJs/productionExecutable/**
            web-release-checksums.sha256
            composeApp/build/reports/tests/**
          if-no-files-found: error

  ios-release-verification:
    needs: preflight
    name: iOS release configuration verification
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@6842eb843b7258993656f41f9c358f5c5331fbe7 # v4
      - uses: actions/setup-java@0969d5d4288c995edd83fa23bc91e83a2c03ba22 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@efa8de904209196588db1453bdb44079b3c393d7 # v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@864def28bf3f78138bbe1c563d360930ae4bb909 # v6
      - run: chmod +x gradlew
      - name: Run simulator tests and link Release framework
        run: >-
          ./gradlew
          :composeApp:verifyBuildIdentity
          :composeApp:iosSimulatorArm64Test
          :composeApp:linkReleaseFrameworkIosSimulatorArm64
          --no-daemon
          --stacktrace
      - name: Build Xcode Release configuration without signing
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          TEAM_ID=
          build
      - uses: actions/upload-artifact@2a0ecf19e8d0087dd2e5d1785dcf764811e79fae # v4
        with:
          name: ios-release-verification
          path: |
            composeApp/build/bin/iosSimulatorArm64/releaseFramework/**
            composeApp/build/reports/tests/**
          if-no-files-found: warn


  ios-signed-archive:
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios_archive
    name: Signed iOS archive and IPA
    runs-on: macos-latest
    env:
      MSA_IOS_TEAM_ID: ${{ secrets.MSA_IOS_TEAM_ID }}
      MSA_IOS_SIGNING_IDENTITY: ${{ secrets.MSA_IOS_SIGNING_IDENTITY }}
      MSA_IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.MSA_IOS_PROVISIONING_PROFILE_SPECIFIER }}
      MSA_IOS_CERTIFICATE_PASSWORD: ${{ secrets.MSA_IOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@6842eb843b7258993656f41f9c358f5c5331fbe7 # v4
      - uses: actions/setup-java@0969d5d4288c995edd83fa23bc91e83a2c03ba22 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@efa8de904209196588db1453bdb44079b3c393d7 # v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@864def28bf3f78138bbe1c563d360930ae4bb909 # v6
      - run: chmod +x gradlew
      - name: Validate iOS signing secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.MSA_IOS_CERTIFICATE_BASE64 }}
          PROFILE_BASE64: ${{ secrets.MSA_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$PROFILE_BASE64"
          test -n "$MSA_IOS_TEAM_ID"
          test -n "$MSA_IOS_SIGNING_IDENTITY"
          test -n "$MSA_IOS_PROVISIONING_PROFILE_SPECIFIER"
          test -n "$MSA_IOS_CERTIFICATE_PASSWORD"
      - name: Install temporary certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.MSA_IOS_CERTIFICATE_BASE64 }}
          PROFILE_BASE64: ${{ secrets.MSA_IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/msa-distribution.p12"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/msa-bee.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/msa-signing.keychain-db"
          mkdir -p "$(dirname "$PROFILE_PATH")"
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"], "msa-distribution.p12").write_bytes(
              base64.b64decode(os.environ["CERTIFICATE_BASE64"], validate=True)
          )
          profile = Path.home() / "Library/MobileDevice/Provisioning Profiles/msa-bee.mobileprovision"
          profile.write_bytes(base64.b64decode(os.environ["PROFILE_BASE64"], validate=True))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MSA_IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
      - name: Test and link iOS Release framework
        run: >-
          ./gradlew
          :composeApp:verifyBuildIdentity
          :composeApp:iosSimulatorArm64Test
          :composeApp:linkReleaseFrameworkIosArm64
          --no-daemon
          --stacktrace
      - name: Archive signed iOS application
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/MSABee.xcarchive"
          DEVELOPMENT_TEAM="$MSA_IOS_TEAM_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="$MSA_IOS_SIGNING_IDENTITY"
          PROVISIONING_PROFILE_SPECIFIER="$MSA_IOS_PROVISIONING_PROFILE_SPECIFIER"
          archive
      - name: Export signed IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$MSA_IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.msa.bee</key>
              <string>$MSA_IOS_PROVISIONING_PROFILE_SPECIFIER</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/MSABee.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Create iOS checksums
        run: >-
          python scripts/hash_artifacts.py
          "$RUNNER_TEMP/ios-export"
          --output ios-release-checksums.sha256
      - uses: actions/upload-artifact@2a0ecf19e8d0087dd2e5d1785dcf764811e79fae # v4
        with:
          name: ios-signed-release
          path: |
            ${{ runner.temp }}/ios-export/*.ipa
            ios-release-checksums.sha256
          if-no-files-found: error
      - name: Remove temporary iOS signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/msa-distribution.p12"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/msa-bee.mobileprovision"
          security delete-keychain "$RUNNER_TEMP/msa-signing.keychain-db" || true
          security list-keychain -d user -s login.keychain-db || true
